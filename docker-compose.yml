version: "3.9"

# ─────────────────────────────────────────────────────────────
#  docker-compose.yml — Production Deploy
#  Ishlatish: docker-compose up -d --build
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Ma'lumotlar Bazasi ─────────────────────────
  db:
    image: postgres:16-alpine
    container_name: uzyolkprik_db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  # ── Django Backend (Gunicorn) ──────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: uzyolkprik_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/site/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── React Frontend (build + Nginx) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: uzyolkprik_frontend
    restart: unless-stopped
    networks:
      - frontend_net
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: uzyolkprik_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      # React build fayllarini nginx konteyneri ham o'qiydi
      - frontend_build:/usr/share/nginx/html:ro
      # SSL sertifikatlar (Let's Encrypt yoki o'z sertifikatingiz)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - frontend_net

# ── Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  frontend_build:
    driver: local
  certbot_data:
    driver: local

# ── Tarmoqlar ──────────────────────────────────────────────
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
