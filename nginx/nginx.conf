# ─────────────────────────────────────────────────────────────
#  Nginx — api.uzyulkuprik.uz  -> backend (swagger, admin, api)
#          uzyulkuprik.uz      -> frontend (React) + /api, /media, /static -> backend
#          www.uzyulkuprik.uz  -> 301 -> uzyulkuprik.uz
# ─────────────────────────────────────────────────────────────

upstream django_backend {
    server backend:8000;
}

upstream react_frontend {
    server frontend:80;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name api.uzyulkuprik.uz uzyulkuprik.uz www.uzyulkuprik.uz;
    return 301 https://$host$request_uri;
}

# www -> asosiy domen
server {
    listen 443 ssl;
    http2 on;
    server_name www.uzyulkuprik.uz;

    ssl_certificate     /etc/letsencrypt/live/api.uzyulkuprik.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uzyulkuprik.uz/privkey.pem;

    return 301 https://uzyulkuprik.uz$request_uri;
}

# ── BACKEND: api.uzyulkuprik.uz (swagger, admin, api) ─────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.uzyulkuprik.uz;

    ssl_certificate     /etc/letsencrypt/live/api.uzyulkuprik.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uzyulkuprik.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;

    # Bosh sahifa -> swagger
    location = / {
        return 302 /swagger/;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";

        location ~* \.(php|py|sh|cgi|pl)$ {
            deny all;
        }
    }

    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;
}

# ── FRONTEND: uzyulkuprik.uz ──────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name uzyulkuprik.uz;

    ssl_certificate     /etc/letsencrypt/live/api.uzyulkuprik.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uzyulkuprik.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Frontend /api/... so'rovlarini backendga o'tkazadi (CORS kerak emas)
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://react_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;
}