# ─────────────────────────────────────────────────────────────
#  Nginx — Asosiy konfiguratsiya (Reverse Proxy)
#  Barcha so'rovlarni to'g'ri joyga yo'naltiradi
# ─────────────────────────────────────────────────────────────

upstream django_backend {
    server backend:8000;
}

# HTTP → HTTPS yo'naltirish
server {
    listen 80;
    server_name _;

    # Let's Encrypt tekshiruvi uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Boshqa barcha so'rovlarni HTTPS ga yo'naltirish
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # SSL sertifikatlar (Let's Encrypt yoki o'zingizniki)
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Vaqtinchalik (sertifikatsiz ishlatish uchun — production da o'chiring)
    ssl_certificate     /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    # Zamonaviy SSL sozlamalari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Xavfsizlik headerlari
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fayl yuklash limiti (media fayllar uchun)
    client_max_body_size 50M;

    # Vaqt limitleri
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;

    # ── Static fayllar (Django collectstatic) ──────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media fayllar (upload qilingan rasmlar/hujjatlar) ──────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";

        # Xavfli fayl turlarini bloklash
        location ~* \.(php|py|sh|cgi|pl)$ {
            deny all;
        }
    }

    # ── Django Admin ───────────────────────────────────────────
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Django API ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # CORS headerlarini Nginx darajasida qo'shmaslik
        # (Django o'zi boshqaradi)
    }

    # ── Swagger / ReDoc ────────────────────────────────────────
    location ~ ^/(swagger|redoc)/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── React Frontend (SPA) ───────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Gzip siqish ────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
}
