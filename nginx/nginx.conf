# ─────────────────────────────────────────────────────────────
#  Nginx — Production konfiguratsiyasi
#  Domain: api.uzyulkuprik.uz
#  SSL: Let's Encrypt (certbot certonly --standalone)
# ─────────────────────────────────────────────────────────────

upstream django_backend {
    server backend:8000;
}

upstream react_frontend {
    server frontend:80;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    server_name api.uzyulkuprik.uz 185.8.213.164;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.uzyulkuprik.uz;

    # SSL — Let's Encrypt sertifikatlar
    # Olish uchun (nginx ishga tushishidan OLDIN):
    #   certbot certonly --standalone -d api.uzyulkuprik.uz
    ssl_certificate     /etc/letsencrypt/live/api.uzyulkuprik.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.uzyulkuprik.uz/privkey.pem;

    # Zamonaviy SSL sozlamalari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Xavfsizlik headerlari ──────────────────────────────────
    # HSTS: hozircha 5 daqiqa (barqaror bo'lgach 31536000 ga o'zgartiring)
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fayl yuklash limiti
    client_max_body_size 50M;

    # Proxy vaqt limitleri
    proxy_connect_timeout 60s;
    proxy_read_timeout 120s;

    # ── Static fayllar ────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media fayllar ─────────────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";

        # Xavfli fayl turlarini bloklash
        location ~* \.(php|py|sh|cgi|pl)$ {
            deny all;
        }
    }

    # ── Django Admin ──────────────────────────────────────────
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Django API ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Swagger / ReDoc ───────────────────────────────────────
    location ~ ^/(swagger|redoc)/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── React Frontend (SPA) ──────────────────────────────────
    location / {
        proxy_pass http://react_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Gzip siqish ───────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
}
