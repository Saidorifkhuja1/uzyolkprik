# ─────────────────────────────────────────────────────────────
#  Nginx — Frontend SPA konfiguratsiyasi
#  Frontend Dockerfile ichida ishlatiladi
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA routing — barcha yo'llar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Favicon va robotlar
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Cache nazorati
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
