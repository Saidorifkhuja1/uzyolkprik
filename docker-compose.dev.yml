version: "3.9"

# ─────────────────────────────────────────────────────────────
#  docker-compose.dev.yml — Local Development
#  Ishlatish: docker-compose -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL (dev uchun) ────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: uzyolkprik_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: uzyolkprik_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5432:5432"   # Local baza bilan ishlash uchun
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uzyolkprik_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Django Backend (hot-reload bilan) ────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder   # dev uchun builder image
    container_name: uzyolkprik_backend_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - DEBUG=True
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=uzyolkprik_dev
      - DB_USER=postgres
      - DB_PASSWORD=devpassword123
    volumes:
      - .:/app          # Hot-reload uchun kod papkasini mount
      - /app/.venv      # venv ni override qilmaslik uchun
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install -r requirements.txt &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # ── React Frontend (dev server) ───────────────────────────
  frontend:
    image: node:20-alpine
    container_name: uzyolkprik_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_dev_data:
    driver: local
